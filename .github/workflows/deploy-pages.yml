name: Deploy to GitHub Pages

# 프로토타입 미리보기용. 정적 호스팅이라 서버 함수가 없으므로
# 조회 2·3단계(쇼핑몰·추정)는 꺼진 채로 빌드된다 — VITE_API_BASE_URL=none.
# 전체 기능은 Cloudflare Pages 배포에서 돈다. README 참고.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - run: npm run build
        env:
          # 레포 이름이 바뀌면 이 값도 같이 바꿔야 한다.
          BASE_PATH: /mac-per-mac/
          VITE_API_BASE_URL: none

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
